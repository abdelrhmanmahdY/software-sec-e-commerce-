{% extends "dashboard/base.html" %}
{% block content %}
<div class="container py-5" style="max-width: 460px;">
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      <h4 class="mb-2">Two-Factor Verification</h4>
      <p class="text-muted mb-3">Enter the 6-digit TOTP code for <strong>{{ username }}</strong>.</p>
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="code" class="form-label">6-Digit Code</label>
          <input type="text" id="code" name="code" class="form-control" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="one-time-code" placeholder="123456">
        </div>
        <button type="submit" class="btn btn-primary w-100">Verify &amp; Sign In</button>
      </form>
      <div class="mt-3 text-center">
        <a href="{% url 'login' %}" class="small text-muted">Cancel and return to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
