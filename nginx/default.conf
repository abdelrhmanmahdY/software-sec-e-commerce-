# TLS termination for the Django app (docker-compose "nginx" service).
# Cert files are mounted at /etc/nginx/certs (see scripts/generate_certs.sh).

# Plain HTTP: never serve content, only redirect to HTTPS.
server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 + 1.3 only; forward-secret AEAD ciphers only (Mozilla "intermediate").
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # With a real CA certificate (Let's Encrypt) also enable:
    #   ssl_stapling on; ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 10m;

    # Uploaded product images (shared volume, read-only here).
    location /media/ {
        alias /media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        # OVERWRITE (not append) so clients cannot spoof their IP in the audit log.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 60s;
    }
}
